name: Build Release APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission
      run: chmod +x gradlew

    - name: Create keystore for signing
      run: |
        mkdir -p app/keystores
        keytool -genkey -v -keystore app/keystores/release.jks \
          -alias release -keyalg RSA -keysize 2048 -validity 10000 \
          -storepass release123 -keypass release123 \
          -dname "CN=Android, OU=Develop, O=MyApp, L=City, ST=State, C=US"

    - name: Build Release APK
      run: ./gradlew assembleRelease --no-daemon --no-scan

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: app/build/outputs/apk/release/
